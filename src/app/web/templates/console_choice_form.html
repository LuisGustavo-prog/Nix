<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nix — Configuração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>{style}</style>
</head>
<body>
    <div class="card">
        <div class="brand-logo">⚡</div>
        <h1>Como a Nix deve iniciar?</h1>
        <p class="subtitle">Essa escolha fica salva, você só vê essa tela de novo se apagar a linha NIX_EXTERNAL_CONSOLE do .env (ou usar o comando de voz pra trocar, em breve).</p>
        <form method="post" action="/choose">
            <button type="submit" name="choice" value="cmd" class="choice-btn">Janela de cmd separada</button>
            <button type="submit" name="choice" value="vscode" class="choice-btn secondary">Aqui mesmo (terminal do VSCode)</button>
        </form>
        <p class="hint">"Janela de cmd separada" libera o terminal do VSCode pra você continuar codando enquanto a Nix roda.</p>
    </div>
</body>
</html>
